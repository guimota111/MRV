# Firebase App Hosting — build e runtime do Next.js (SSR nativo).
#
# As variáveis NEXT_PUBLIC_* são públicas por natureza (vão para o bundle do
# navegador) e a configuração do Firebase Web não é segredo — o que protege os
# dados são as Security Rules. A chave da Anthropic NÃO aparece aqui: ela vive
# no Secret Manager e só é lida pelas Cloud Functions.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: SUBSTITUA_PELA_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: SUBSTITUA.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: SUBSTITUA_PELO_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: SUBSTITUA.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: SUBSTITUA_PELO_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: SUBSTITUA_PELO_APP_ID
    availability:
      - BUILD
      - RUNTIME
